<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MUSC 1100 期中复习：拉美音乐知识地图、听力练习与英文模拟考题。仅供教育用途。">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>拉美声音地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an atlas plate. The map fills the screen; content countries rest flat
   until hovered, then rise as floating soil. Water-drop pins mark them.
   Clicking opens a paged field guide: one topic per page, figure + text. */
:root{
  --sea:#d6e3e1; --sea-line:#bfd2cf; --sea-label:#7d9a96;
  --land:#f2ede2; --border:#dcd2bf; --pit:#c4b498; --shadow:#2b3a36;
  --moss:#88a865; --moss-hi:#c3dba2; --grain:#5c7a3e;
  --soil1:#4e3423; --soil2:#6e4a30; --soil3:#8f623f; --soil4:#b28659;
  --drop:#1f5fc4; --drop-hi:#8cbcff; --drop-deep:#123d85;
  --ink:#1b2628; --ink-2:#4a5a5b; --ink-3:#7d8b8a;
  --paper:#fbfaf6; --paper-2:#f1eee6; --rule:#e2ddd1;
  --hl:#fff3c4; --a-af:#b4532a; --a-eu:#2f6db5; --a-in:#4f8a3c;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-latin:"Instrument Serif","Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0e1b20; --sea-line:#172a30; --sea-label:#4d6a6c;
  --land:#273532; --border:#344541; --pit:#0a1213; --shadow:#000;
  --moss:#5d8744; --moss-hi:#94bf72; --grain:#2c4520;
  --soil1:#2e1f15; --soil2:#47301f; --soil3:#64432b; --soil4:#86603e;
  --drop:#4f93ff; --drop-hi:#c4dcff; --drop-deep:#1d4f9e;
  --ink:#e8eeea; --ink-2:#a9b8b3; --ink-3:#71817c;
  --paper:#111b1d; --paper-2:#182427; --rule:#253437;
  --hl:#3b3519; --a-af:#e0835a; --a-eu:#79a9ea; --a-in:#8cc477;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sea:#0e1b20; --sea-line:#172a30; --sea-label:#4d6a6c;
  --land:#273532; --border:#344541; --pit:#0a1213; --shadow:#000;
  --moss:#5d8744; --moss-hi:#94bf72; --grain:#2c4520;
  --soil1:#2e1f15; --soil2:#47301f; --soil3:#64432b; --soil4:#86603e;
  --drop:#4f93ff; --drop-hi:#c4dcff; --drop-deep:#1d4f9e;
  --ink:#e8eeea; --ink-2:#a9b8b3; --ink-3:#71817c;
  --paper:#111b1d; --paper-2:#182427; --rule:#253437;
  --hl:#3b3519; --a-af:#e0835a; --a-eu:#79a9ea; --a-in:#8cc477;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--drop);outline-offset:3px;border-radius:6px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-inline:16px;padding-block:14px 10px;gap:10px;box-sizing:border-box}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,36px);letter-spacing:.04em;line-height:1.1;text-wrap:balance}
h1 em{font-family:var(--f-latin);font-style:italic;font-weight:400;letter-spacing:0;color:var(--ink-2);margin-left:.35em;font-size:.82em}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--rule);background:var(--paper);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:14px;height:14px}

.mapframe{position:relative;min-height:0;border-radius:20px;overflow:hidden;background:var(--sea);box-shadow:inset 0 0 0 1px var(--sea-line)}
.mapframe svg.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.grat{fill:none;stroke:var(--sea-line);stroke-width:.8}
.ocean-label{font-family:var(--f-latin);font-style:italic;fill:var(--sea-label);font-size:17px;letter-spacing:.2em}
.ocean-label.zh{font-family:var(--f-display);font-style:normal;font-size:12px;letter-spacing:.5em}
.land{fill:var(--land)}
.borders{fill:none;stroke:var(--border);stroke-width:.7;stroke-linejoin:round}
.route{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 6;opacity:.22;transition:opacity .5s}
.route.af{stroke:var(--a-af)} .route.eu{stroke:var(--a-eu)}
.routes.on .route{opacity:.95;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}

/* floating soil */
.chunk{cursor:pointer}
.chunk .pit,.chunk .shadow{opacity:0;transition:opacity .45s ease}
.chunk .pit{pointer-events:all}
.chunk .shadow{pointer-events:none}
.chunk .hit{fill:transparent;pointer-events:none}
.chunk.up .hit{pointer-events:all}
.chunk .pit{fill:var(--pit)}
.chunk .shadow{fill:var(--shadow);filter:url(#soft);transform-box:view-box;transform-origin:var(--ox) var(--oy);transform:translateY(6px) scale(.92)}
.chunk .lift{transform-box:view-box;transform-origin:var(--ox) var(--oy);transition:transform .6s cubic-bezier(.2,.9,.25,1.15)}
.chunk .layer{transition:transform .6s cubic-bezier(.2,.9,.25,1.1)}
.chunk .top{fill:var(--land);transition:fill .45s}
.chunk .top-edge{fill:none;stroke:transparent;stroke-width:1.2;vector-effect:non-scaling-stroke;transition:stroke .45s}
.chunk .tex{opacity:0;transition:opacity .45s}
.chunk.up .pit{opacity:1}
.chunk.up .shadow{opacity:.35}
.chunk.up .lift{transform:translateY(var(--L)) scale(var(--s))}
.chunk.up .layer{transform:translateY(calc(var(--i) * var(--step)))}
.chunk.up .top{fill:var(--moss)}
.chunk.up .top-edge{stroke:var(--moss-hi)}
.chunk.up .tex{opacity:.55}
.chunk.up .bob{animation:bob 3.4s ease-in-out .6s infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.crumb{stroke:var(--soil4);stroke-width:1.4;stroke-dasharray:1.5 2.6;vector-effect:non-scaling-stroke}

/* pins: inverted water drops */
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:30px;height:40px;margin:-40px 0 0 -15px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;transform-origin:50% 100%;animation:drip 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.pin svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgb(0 0 0 / .22));transition:transform .35s cubic-bezier(.2,.9,.25,1.3)}
.pin .body{fill:var(--drop)} .pin .glint{fill:var(--drop-hi);opacity:.9} .pin .core{fill:var(--paper)}
.pin.on svg{transform:translateY(-14px) scale(1.12)}
.pin .tag{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%) translateY(4px);white-space:nowrap;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 18px -8px rgb(0 0 0 / .35)}
.pin .tag b{font-family:var(--f-display);font-weight:700;margin-right:6px}
.pin .tag i{font-family:var(--f-latin);font-size:15px;color:var(--ink-2)}
.pin.on .tag{opacity:1;transform:translateX(-50%) translateY(-14px)}
.pin .tap{display:none;color:var(--drop);margin-left:6px;font-style:normal}
.touch .pin.on .tap{display:inline}
@keyframes drip{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ripple{position:absolute;width:16px;height:6px;margin:-3px 0 0 -8px;border-radius:50%;border:1.5px solid var(--drop);opacity:0;pointer-events:none;animation:ripple 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ripple{0%{opacity:.7;transform:scale(.3)}60%,100%{opacity:0;transform:scale(1.8)}}
.stem{position:absolute;height:1.5px;background:var(--drop);opacity:.55;transform-origin:0 50%;pointer-events:none}
.dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--drop);pointer-events:none}

/* location chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 4px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer;font-size:13px;transition:border-color .2s,transform .2s}
.chip:hover,.chip.on{border-color:var(--drop);transform:translateY(-2px)}
.chip svg{width:14px;height:18px}
.chip b{font-family:var(--f-display);font-weight:700}
.chip i{font-family:var(--f-latin);font-size:15px;color:var(--ink-2)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sea) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.viewer[hidden]{display:none!important}
.sheet{width:min(1120px,100%);height:min(760px,100%);background:var(--paper);border-radius:22px;box-shadow:0 30px 80px -30px rgb(0 0 0 / .45),0 0 0 1px var(--rule);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;animation:rise .45s cubic-bezier(.2,.9,.25,1.05)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:14px;padding:16px 20px 12px;border-bottom:1px solid var(--rule)}
.sheet-head .where{min-width:0;flex:1}
.sheet-head .where .eyebrow{display:block}
.sheet-head h3{margin:2px 0 0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.03em}
.sheet-head h3 i{font-family:var(--f-latin);font-weight:400;color:var(--ink-2);margin-left:.4em;font-size:1.05em}
.count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.x svg{width:14px;height:14px}
.stage{position:relative;overflow:hidden}
.page{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);overflow:auto}
.page.in{animation:pin .4s cubic-bezier(.2,.9,.3,1)} .page.in.back{animation-name:pinb}
@keyframes pin{from{opacity:0;transform:translateX(28px)}} @keyframes pinb{from{opacity:0;transform:translateX(-28px)}}
.fig{margin:0;background:var(--paper-2);display:flex;align-items:center;justify-content:center;padding:28px;min-width:0;min-height:0;color:var(--ink-2)}
.fig > *{max-width:100%}
.txt{padding:30px 34px 28px;min-width:0;display:flex;flex-direction:column;gap:12px}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--drop);margin:0}
.txt h2{margin:0;font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);font-weight:700;line-height:1.3;letter-spacing:.02em;text-wrap:balance}
.lead{margin:0;font-size:16px;line-height:1.75;color:var(--ink)}
.txt ul{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.txt li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.txt li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--soil3)}
.txt li b,.lead b{color:var(--ink);font-weight:600}
.tip{margin-top:auto;padding:12px 14px;border-radius:12px;background:var(--hl);font-size:14px;line-height:1.65}
.tip::before{content:"考点";font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;display:block;color:var(--ink-3);margin-bottom:2px}
.lat{font-family:var(--f-latin);font-size:1.12em}
.sheet-foot{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--rule)}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:var(--rule);cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:22px;background:var(--drop)}
.nav{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.nav:disabled{opacity:.35;cursor:default}
.nav.primary{background:var(--drop);border-color:var(--drop);color:#fff}

/* figure components */
.instr{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:14px;width:100%;max-width:520px}
.ins{display:grid;grid-template-rows:auto auto auto;justify-items:center;text-align:center;gap:4px;padding:14px 10px 12px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}
.ins svg{width:58px;height:58px;color:var(--soil2)}
.ins .n{font-family:var(--f-latin);font-size:20px;color:var(--ink);line-height:1.1}
.ins .r{font-size:12px;line-height:1.55;color:var(--ink-2)}
.ins.key{box-shadow:0 0 0 2px var(--drop)}
svg.dia{width:100%;max-width:560px;height:auto;overflow:visible}
.dia text{fill:var(--ink-2);font-family:var(--f-body);font-size:13px}
.dia .lat-t{font-family:var(--f-latin);font-size:16px;fill:var(--ink)}
.dia .mono{font-family:var(--f-mono);font-size:11px;fill:var(--ink-3)}
.tl{list-style:none;margin:0;padding:0;width:100%;max-width:460px;position:relative}
.tl::before{content:"";position:absolute;left:78px;top:8px;bottom:8px;width:2px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:70px 1fr;gap:22px;padding:9px 0;position:relative}
.tl li::after{content:"";position:absolute;left:73px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--soil3)}
.tl li.key::after{background:var(--drop);border-color:var(--drop)}
.tl .y{font-family:var(--f-mono);font-size:13px;color:var(--ink);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.tl .t{font-size:14px;line-height:1.6;color:var(--ink-2)}
.tl li.key .t{color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:540px}
.cmp .col{background:var(--paper);border-radius:14px;padding:16px;box-shadow:0 0 0 1px var(--rule)}
.cmp h4{margin:0 0 10px;font-family:var(--f-display);font-size:16px;padding-bottom:8px;border-bottom:2px solid var(--c,var(--soil3))}
.cmp ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.cmp li{font-size:13px;line-height:1.55;color:var(--ink-2)}
.cmp .common{grid-column:1/-1;font-size:13.5px;line-height:1.6;padding:12px 14px;border-radius:12px;border:1.5px dashed var(--ink-3);color:var(--ink)}
.cmp .common b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);display:block;font-weight:400}
.pairs{width:100%;max-width:500px;display:grid;gap:10px}
.pair{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:6px}
.pair .l,.pair .r{background:var(--paper);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--rule)}
.pair .l{border-left:3px solid var(--a-af)} .pair .r{border-left:3px solid var(--a-eu)}
.pair .nm{font-family:var(--f-latin);font-size:18px;color:var(--ink);line-height:1.15}
.pair .ds{font-size:12px;color:var(--ink-3)}
.pair .eq{text-align:center;color:var(--ink-3);font-family:var(--f-mono)}
.pairs .hd{display:grid;grid-template-columns:1fr 40px 1fr;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);gap:6px}
.flow{display:grid;gap:0;width:100%;max-width:420px}
.flow .st{background:var(--paper);border-radius:14px;padding:12px 16px;box-shadow:0 0 0 1px var(--rule)}
.flow .st b{font-family:var(--f-display);font-size:16px;display:block;color:var(--ink)}
.flow .st span{font-size:13px;color:var(--ink-2);line-height:1.55}
.flow .ar{height:26px;display:grid;place-items:center;color:var(--drop)}
.check{display:grid;gap:12px;width:100%;max-width:420px}
.check .it{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--paper);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--rule)}
.check .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--drop);font-family:var(--f-mono);font-size:13px}
.check b{display:block;font-size:15px;color:var(--ink)}
.check span{font-size:13px;color:var(--ink-2);line-height:1.5}
.secs{width:100%;max-width:520px;display:grid;gap:18px}
.secs .row-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px}
.secs .bar{display:flex;gap:4px}
.secs .seg{border-radius:10px;padding:12px 12px;min-width:0;font-size:13px;line-height:1.45;color:var(--ink)}
.secs .seg b{display:block;font-family:var(--f-latin);font-size:19px;font-weight:400}
.seg.a{background:color-mix(in srgb,var(--a-eu) 18%,var(--paper))}
.seg.b{background:color-mix(in srgb,var(--a-af) 20%,var(--paper))}
.seg.c{background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.cr{display:flex;gap:3px;margin-top:6px}
.cr span{flex:1;height:22px;border-radius:5px;font-size:11px;display:grid;place-items:center;color:var(--ink)}
.cr .c1{background:color-mix(in srgb,var(--a-af) 30%,var(--paper))}
.cr .c2{background:color-mix(in srgb,var(--drop) 22%,var(--paper))}
.quote{max-width:500px;background:var(--paper);border-radius:16px;padding:22px 24px;box-shadow:0 0 0 1px var(--rule);font-family:var(--f-latin);font-size:19px;line-height:1.55;color:var(--ink)}
.quote mark{background:var(--hl);color:inherit;padding:0 .15em;border-radius:3px}
.quote small{display:block;margin-top:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.terms{width:100%;max-width:540px;border-collapse:collapse;font-size:13px}
.terms th{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-align:left;padding:0 10px 8px}
.terms td{padding:9px 10px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2);line-height:1.5}
.terms td:first-child{font-family:var(--f-latin);font-size:17px;color:var(--ink);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.figwrap{display:grid;justify-items:center;width:100%}

/* listening */
.app.quizmode .listen{display:grid}
.listen{min-height:0;background:var(--paper);border-radius:20px;box-shadow:0 0 0 1px var(--rule);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.listen[hidden]{display:none!important}
.listen:focus,.quiz:focus{outline:none}
.ls-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.ls-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ls-lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.seg-ctl.small button{padding:5px 11px;font-size:13px}
.seg-ctl.small button[aria-checked="true"]{background:var(--ink);color:var(--paper)}

  secs:(rows)=>`<div class="secs">${rows.map(r=>`<div><div class="row-l">${r.label}</div><div class="bar">${r.parts.map(([n,d,flex,t])=>`<div class="seg ${t}" style="flex:${flex}"><b>${n}</b>${d}</div>`).join('')}</div>${r.cr?`<div class="cr">${r.cr.map((c,i)=>`<span class="${i%2?'c2':'c1'}">${c}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`,
  quote:(html,note)=>`<div class="quote">${html}<small>${note}</small></div>`,

  rhythm:({steps,group,rows,note,labels})=>{
    const cw=26, lw=112, h=34, W=lw+steps*cw, H=rows.length*h+34;
    let s=`<svg class="dia" viewBox="0 0 ${W} ${H}" role="img">`;
    for(let i=0;i<steps;i++){ if(i%group===0) s+=`<text class="mono" x="${lw+i*cw+cw/2}" y="12" text-anchor="middle">${labels?labels[i/group]:(i/group+1)}</text>`; }
    rows.forEach((r,ri)=>{
      const y=20+ri*h;
      s+=`<text x="${lw-12}" y="${y+h/2+4}" text-anchor="end" class="${r.lat?'lat-t':''}">${r.n}</text>`;
      for(let i=0;i<steps;i++){
        const x=lw+i*cw, hit=r.hits.includes(i), acc=r.acc&&r.acc.includes(i);
        const gstart=i%group===0;
        s+=`<rect x="${x+2}" y="${y+4}" width="${cw-4}" height="${h-8}" rx="5" fill="${hit?(acc?'var(--drop)':r.c||'var(--soil3)'):'var(--paper)'}" stroke="${hit?'none':'var(--rule)'}" ${gstart&&!hit?'stroke-width="1.6"':''}/>`;
        if(r.mark&&r.mark[i]) s+=`<text x="${x+cw/2}" y="${y+h/2+4}" text-anchor="middle" style="fill:var(--paper);font-size:11px;font-family:var(--f-mono)">${r.mark[i]}</text>`;
      }
      if(r.brackets) r.brackets.forEach(([a,b])=>{ s+=`<path d="M${lw+a*cw+3} ${y+h-1} v4 H${lw+(b+1)*cw-3} v-4" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/>`; });
    });
    for(let i=0;i<=steps;i+=group) s+=`<line x1="${lw+i*cw}" y1="18" x2="${lw+i*cw}" y2="${20+rows.length*h}" stroke="var(--ink-3)" stroke-width="${i%(group*(steps>12?4:3))===0?1.2:.5}" opacity=".45"/>`;
    if(note) s+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" class="mono">${note}</text>`;
    return s+'</svg>';
  },
  svg:(name)=>DIA[name](),
};

function chunkSVG(k){
  const s = LIFT[k], [ox,oy] = anchor(k);
  const ref = k==='nyc' ? '#g-nyc' : `#g-${k}`;
  const clip = k==='nyc' ? ' clip-path="url(#c-nyc)"' : '';
  const soil = i => i<=3?'var(--soil1)':i<=7?'var(--soil2)':i<=10?'var(--soil3)':'var(--soil4)';
  let layers=''; for(let i=LAYERS;i>=1;i--) layers += `<use href="${ref}" class="layer${i===LAYERS?' crumb':''}" style="--i:${i};fill:${soil(i)}"${clip}/>`;
  return `<g class="chunk" data-k="${k}" style="--ox:${ox}px;--oy:${oy}px;--s:${s};--L:-26px;--step:${(DEPTH/LAYERS/s).toFixed(3)}px">
    <use href="${ref}" class="pit"${clip}/>
    <g class="hit">${[5,10,15,20,25].map(d=>`<use href="${ref}" transform="translate(0 -${d})"${clip}/>`).join('')}</g>
    <use href="${ref}" class="shadow"${clip}/>
    <g class="lift"><g class="bob">${layers}<use href="${ref}" class="top"${clip}/><use href="${ref}" class="tex" fill="url(#grain)"${clip}/><use href="${ref}" class="top-edge"${clip}/></g></g>
  </g>`;
}

  pinsEl.insertAdjacentHTML('beforeend', `${p.off[0]||p.off[1]?`<span class="stem" data-k="${p.key}"></span><span class="dot" data-k="${p.key}"></span>`:''}<span class="ripple" data-k="${p.key}" style="${d}"></span>
  <button class="pin" type="button" data-k="${p.key}" style="${d}" aria-label="${p.name} · ${p.genre}">${drop()}<span class="tag"><b>${p.name}</b><i>${p.genre}</i><em class="tap">再点一次进入 →</em></span></button>`);
});
document.getElementById('chips').innerHTML = PLACES.map(p=>`<button class="chip" type="button" data-k="${p.key}"><svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 39C15 39 2 23.5 2 14.5a13 13 0 0 1 26 0C28 23.5 15 39 15 39z" fill="var(--drop)"/></svg><b>${p.name}</b><i>${p.genre}</i></button>`).join('');

function layout(){
  const r = frame.getBoundingClientRect();
  const narrow = r.width/r.height < 1.05;
  map.setAttribute('viewBox', narrow ? '330 150 610 690' : `0 0 ${GEO.W} ${GEO.H}`);
  map.setAttribute('preserveAspectRatio', narrow ? 'xMidYMid meet' : 'xMidYMid slice');
  const m = map.getScreenCTM(); if(!m) return;
  const toPx = ([x,y])=>{const pt=map.createSVGPoint();pt.x=x;pt.y=y;const q=pt.matrixTransform(m);return [q.x-r.left,q.y-r.top];};
  PLACES.forEach(p=>{
    const [ax,ay] = toPx(anchor(p.key));
    const [dx,dy] = p.off; const tx=ax+dx, ty=ay+dy;
    const vis = ax>-20 && ax<r.width+20 && ay>-20 && ay<r.height+20;
    pinsEl.querySelectorAll(`[data-k="${p.key}"]`).forEach(el=>{
      el.style.visibility = vis?'visible':'hidden';
      if(el.classList.contains('pin')||el.classList.contains('ripple')){el.style.left=tx+'px';el.style.top=ty+'px';}
      else if(el.classList.contains('dot')){el.style.left=ax+'px';el.style.top=ay+'px';}
      else if(el.classList.contains('stem')){const len=Math.hypot(dx,dy);el.style.left=ax+'px';el.style.top=ay+'px';el.style.width=len+'px';el.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;}
    });
  });
}
new ResizeObserver(layout).observe(frame); layout();
if(document.fonts) document.fonts.ready.then(layout);

let hovered=null, opened=null, touch=false;
function lift(k,on){
  const c = chunksG.querySelector(`.chunk[data-k="${k}"]`);
  document.querySelectorAll(`.pin[data-k="${k}"], .chip[data-k="${k}"]`).forEach(e=>e.classList.toggle('on',on));
  if(k==='atlantic') routes.classList.toggle('on',on);
  if(!c) return;
  if(on && !c.classList.contains('up')){
    // only re-stack a chunk that has fully settled; moving a node mid-transition makes it snap
    const settled = !c._down || performance.now()-c._down > 700;
    if(settled && c !== chunksG.lastElementChild){
      chunksG.appendChild(c);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(hovered===k||opened===k) c.classList.add('up'); }));
    } else c.classList.add('up');
  }
  else if(!on && c.classList.contains('up')){ c.classList.remove('up'); c._down = performance.now(); }
}
let leaveT=null;
function enter(k){ clearTimeout(leaveT); hover(k); }
function leave(k){ clearTimeout(leaveT); leaveT=setTimeout(()=>{ if(hovered===k) hover(null); },160); }
function hover(k){ if(hovered===k) return; if(hovered && hovered!==opened) lift(hovered,false); hovered=k; if(k) lift(k,true); }
addEventListener('pointerdown',e=>{touch = e.pointerType==='touch'; document.body.classList.toggle('touch',touch);},true);
function bind(el){
  const k = el.dataset.k;
  el.addEventListener('pointerenter',e=>{ if(e.pointerType!=='touch') enter(k); });
  el.addEventListener('pointerleave',e=>{ if(e.pointerType!=='touch') leave(k); });
  el.addEventListener('focus',()=>hover(k));
  el.addEventListener('blur',()=>{ if(hovered===k) hover(null); });
  el.addEventListener('click',()=>{ if(touch && hovered!==k && el.classList.contains('pin')){ hover(k); return; } open(k); });
}
pinsEl.querySelectorAll('.pin').forEach(bind);
document.querySelectorAll('.chip').forEach(bind);
chunksG.querySelectorAll('.chunk').forEach(c=>{ c.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')enter(c.dataset.k)}); c.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')leave(c.dataset.k)}); c.addEventListener('click',()=>open(c.dataset.k)); });
map.addEventListener('click',e=>{ if(touch && !e.target.closest('.chunk')) hover(null); });

const V = {el:document.getElementById('viewer'),stage:document.getElementById('stage'),title:document.getElementById('vTitle'),sub:document.getElementById('vSub'),count:document.getElementById('vCount'),dots:document.getElementById('vDots'),prev:document.getElementById('vPrev'),next:document.getElementById('vNext')};
let cur=null, idx=0, lastFocus=null;
function open(k,i=0){
  cur = ALL[k]; idx=i; lastFocus=document.activeElement;
  if(opened && opened!==k) lift(opened,false);
  opened = k; if(k!=='guide') lift(k,true);
  V.title.innerHTML = `${cur.name}<i>${cur.genre}</i>`; V.sub.textContent = cur.sub;
  V.dots.innerHTML = cur.pages.map((p,j)=>`<button type="button" aria-label="第 ${j+1} 页：${p.t}"></button>`).join('');
  V.dots.querySelectorAll('button').forEach((b,j)=>b.onclick=()=>go(j));
  const hasT = LIB.tracks.some(t=>t.place===k); const vl=document.getElementById('vListen'); vl.hidden=!hasT; vl.onclick=()=>lsOpenPlace(k);
  V.el.hidden=false; render(0); V.next.focus({preventScroll:true});
}
function close(){ V.el.hidden=true; const k=opened; opened=null; if(k && k!==hovered) lift(k,false); if(lastFocus) lastFocus.focus({preventScroll:true}); }
function render(dir){
  const p = cur.pages[idx];
  V.stage.innerHTML = `<article class="page in${dir<0?' back':''}"><figure class="fig">${p.fig}</figure><div class="txt"><p class="kicker">${p.k}</p><h2>${p.t}</h2><p class="lead">${p.lead}</p>${p.pts&&p.pts.length?`<ul>${p.pts.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${p.tip?`<p class="tip">${p.tip}</p>`:''}</div></article>`;
  V.count.textContent = `${String(idx+1).padStart(2,'0')} / ${String(cur.pages.length).padStart(2,'0')}`;
  V.dots.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===idx));
  V.prev.disabled = idx===0;
  const last = idx===cur.pages.length-1;
  const order = PLACES.map(p=>p.key), ni = order.indexOf(cur.key);
  const nextPlace = cur.key!=='guide' && last ? PLACES[(ni+1)%PLACES.length] : null;
  V.next.innerHTML = last ? (nextPlace?`<span class="lbl">下一站：${nextPlace.name}</span>→`:'<span class="lbl">回到地图</span>✓') : '<span class="lbl">下一页</span>→';
  V.next.dataset.goto = nextPlace?nextPlace.key:'';
}
function go(j){ if(j<0||j>=cur.pages.length||j===idx) return; const d=j>idx?1:-1; idx=j; render(d); }
V.prev.onclick=()=>go(idx-1);
V.next.onclick=()=>{ if(idx<cur.pages.length-1) go(idx+1); else if(V.next.dataset.goto) open(V.next.dataset.goto); else close(); };
document.getElementById('vClose').onclick=close;
V.el.addEventListener('click',e=>{ if(e.target===V.el) close(); });
addEventListener('keydown',e=>{ if(V.el.hidden) return; if(e.key==='Escape') close(); else if(e.key==='ArrowRight') V.next.click(); else if(e.key==='ArrowLeft') go(idx-1); });
let sx=null; V.stage.addEventListener('pointerdown',e=>{sx=e.clientX}); V.stage.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>60){ dx<0?V.next.click():go(idx-1);} });
document.getElementById('guideBtn').onclick=()=>open('guide');

rtist": "World Music: A Global Journey", "date": "2017", "track": "10/28", "disc": "3/3", "durationSeconds": 125.573515}, "inst": ["accordion", "guira", "tambora", "saxophone"], "ctx": {"accordion": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "guira": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "tambora": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "saxophone": "扩展对照：部分 Merengue 编制常见；教材示例未列。"}}, {"id": "musc1100-06", "title": "Steel Band", "location": "Trinidad", "place": "trinidad", "country": "TT", "src": "media/audio/musc1100-06.mp4", "info": {"曲种 / 国家或社群": "Steel pan（钢鼓） / steelband（钢鼓乐队）；千里达及托巴哥（非裔千里达人）", "主要乐器与作用": "tenor pan（高音旋律钢鼓） 奏旋律；double seconds（双盘中高音钢鼓） 和 guitar pan（中音和声钢鼓） 奏和声与扫弦式节奏；cello pan（中低音钢鼓）、bass pan（低音钢鼓） 奏低音；engine room（节奏打击乐声部） 用刹车鼓（irons（刹车鼓等金属打击件））、鼓组、congas（康加高脚手鼓） 打底", "语言": "器乐", "主要音乐特征": "明亮金属音色；用快速滚奏延长音响，不等同于 vibrato（颤音，音高有规律地轻微波动）；旋律与和声分工清楚。常演奏 calypso（卡利普索，千里达歌曲与舞曲传统） 等舞曲，也能演奏其他曲种，不能仅凭钢鼓断定拍号或曲风。", "演出场合与功能": "狂欢节、Panorama（千里达钢鼓乐队比赛） 比赛；国家乐器", "原住民 / 非洲 / 欧洲影响": "非裔千里达人在狂欢节和社区传统中发展出钢鼓；经历竹管打击乐、金属容器等阶段，后来采用油桶。欧洲调律与和声亦有影响，不宜简化成“禁鼓＋二战油桶”单一原因。"}, "audit": "音色、滚奏和声部分工基本正确；历史改为多阶段发展，细分钢鼓声部是常见编制，并非已逐一确认出现在本文件。", "sources": [{"title": "NALIS：钢鼓的历史和乐队分工", "url": "https://www.nalis.gov.tt/resources/tt-content-guide/steelband/"}], "meta": {"title": "Trinidad-Steel Band", "album": "World Music: A Global Journey", "artist": "Various Artists", "date": "2005", "track": "15/36", "disc": "2/2", "durationSeconds": 121.765442}, "inst": ["tenor-pan", "double-seconds", "guitar-pan", "cello-pan", "bass-pan", "irons", "drumkit", "congas"], "ctx": {"tenor-pan": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "double-seconds": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "guitar-pan": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "cello-pan": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "bass-pan": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "irons": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "drumkit": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "congas": "曲目说明提及；实际出现情况请结合听辨与核对说明。"}}, {"id": "musc1100-07", "title": "Sikuri Ensemble", "location": "Peru", "place": "peru", "country": "PE", "src": "media/audio/musc1100-07.mp4", "info": {"曲种 / 国家或社群": "Sikuri（安第斯排箫合奏） 排箫合奏；秘鲁安第斯（Aymara（艾马拉族及其语言）、Quechua（克丘亚族及其语言） 社区）", "主要乐器与作用": "siku（安第斯排箫） 排箫常以 ira（排箫互补音列的一组，常称领奏组）、arka（与 ira 互补的另一组） 两组互补音列，通过 hocket（交错奏，多个声部轮流拼出旋律） 拼合旋律；bombo（大鼓） 大鼓和 caja（小鼓） 小鼓伴奏。", "语言": "器乐", "主要音乐特征": "气息声较明显，排箫群奏层次厚，旋律反复并可能有平行声部。教材示例的鼓句长度不完全规则，原表笼统写“二拍子”过强；“不用 vibrato（颤音，音高有规律地轻微波动）”也不应绝对化。", "演出场合与功能": "安第斯社区节庆、宗教活动；教材对应来源为复活节音乐，Candelaria（圣烛节） 节是其他常见场合，不能直接当作本录音场景。", "原住民 / 非洲 / 欧洲影响": "原住民：排箫和 hocket（交错奏，多个声部轮流拼出旋律） 体现安第斯的互补、互惠观念；欧洲：天主教节日框架，大鼓受军乐影响"}, "audit": "补小鼓，弱化固定拍号；互补吹奏是重要识别点。文件 1:33 与教材同名示例一致，但时长一致不等同于已完成音频指纹比对。", "sources": [{"title": "教材第 12 章听辨指南（第三版扫描）", "url": "https://ahsibmusic.weebly.com/uploads/3/8/5/9/38592287/south_america_and_mexico.pdf"}, {"title": "Smithsonian：秘鲁山区音乐与复活节曲目", "url": "https://folkways.si.edu/mountain-music-of-peru-vol-2/american-indian-world/album/smithsonian"}], "meta": {"title": "Peru-Sikuri Ensemble", "album": "World Music: A Global Journey", "artist": "Various Artists", "date": "2005", "track": "20/36", "disc": "2/2", "durationSeconds": 93.042358}, "inst": ["siku", "bombo", "caja"], "ctx": {"siku": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "bombo": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "caja": "曲目说明提及；实际出现情况请结合听辨与核对说明。"}}, {"id": "musc1100-08", "title": "Amazonian Indian Chant", "location": "Brazil", "place": "brazil", "country": "BR", "src": "media/audio/musc1100-08.mp4", "info": {"曲种 / 国家或社群": "Amazonian Indian Chant（亚马逊原住民吟唱）；巴西亚马逊原住民吟唱。教材对应为 Kayapó-Xikrin（卡亚波—希克林原住民社群） 社群示例。", "主要乐器与作用": "教材同名示例为男子集体吟唱，没有列出乐器伴奏；原表 maracá（原住民葫芦摇响器） 守拍子的说法不适合直接用于这个示例。", "语言": "教材对应来源为 Kayapó（卡亚波原住民及其语言） 语；需区分具体社群语言与笼统的“原住民语言”", "主要音乐特征": "以齐唱的单声部为主，少数音高、反复短句、句末下滑；pitch bending（连续改变音高，产生滑音） 是音高滑动，不等同于 vibrato（颤音，音高有规律地轻微波动）。不要把个别社群的特征概括为所有亚马逊音乐。", "演出场合与功能": "教材将该示例联系到命名仪式；更广泛的社群音乐也承担仪式与知识传承功能，不能把本片段直接定为治疗仪式。", "原住民 / 非洲 / 欧洲影响": "以当地原住民传统为主要背景。“几乎没有外来成分”“全部十首的对照组”缺乏依据，删除。"}, "audit": "曲名、专辑与约 1:13 时长对应教材示例；据教材改为无乐器伴奏。具体音频身份属于文献匹配推断，未做逐秒听音鉴定。", "sources": [{"title": "教材第 12 章听辨指南（第三版扫描）", "url": "https://ahsibmusic.weebly.com/uploads/3/8/5/9/38592287/south_america_and_mexico.pdf"}, {"title": "Smithsonian：卡亚波—希克林仪式音乐", "url": "https://folkways.si.edu/traditional-music-of-the-world-vol-7-ritual-music-of-the-kayapo-xikrin-brazil/american-indian-world/album/smithsonian"}], "meta": {"title": "Brazil-Amazonian Indian Chant", "album": "World Music: A Global Journey", "artist": "Various Artists", "date": "2005", "track": "19/36", "disc": "2/2", "durationSeconds": 72.817778}, "inst": ["maraca"], "ctx": {"maraca": "纠错对照：原表提到此乐器，但教材示例为男子集体吟唱，未列乐器伴奏。"}}, {"id": "musc1100-09", "title": "Samba", "location": "Brazil", "place": "brazil", "country": "BR", "src": "media/audio/musc1100-09.mp4", "info": {"曲种 / 国家或社群": "Samba（桑巴）；巴西桑巴音乐。不可仅凭文件名认定为 escola de samba（桑巴学校，即社区桑巴组织） 游行大乐队。", "主要乐器与作用": "教材示例列有吉他、cavaquinho（巴西四弦小吉他）（亦称 cavaco（cavaquinho 的简称，巴西四弦小吉他））、电贝斯、surdo（低音大鼓）、cuíca（摩擦鼓）、pandeiro（带金属响片的框鼓） 和摇响器。caixa（军鼓式小鼓）、tamborim（小型单面框鼓）、agogô（双音铃） 常用于其他桑巴编制，不能全部写成本录音已确认乐器。", "语言": "葡萄牙语", "主要音乐特征": "切分与多层节奏是重要线索，主旋律与伴奏相结合；常用二拍子记谱。cuíca（摩擦鼓） 的摩擦音色很有辨识度；不必将歌曲演唱一概称为游行领唱 puxador（桑巴游行中的领唱者）。", "演出场合与功能": "社交、歌唱和舞蹈；狂欢节与 escolas de samba（桑巴学校，即社区桑巴组织） 是重要背景，但并非每一首桑巴都是游行现场。", "原住民 / 非洲 / 欧洲影响": "非洲：鼓乐队、复节奏、cuíca（摩擦鼓）、应答；欧洲：cavaquinho（巴西四弦小吉他）、和声、葡萄牙语、分段歌词"}, "audit": "本文件约 2:02，与教材同名示例相符；原表把通用的游行鼓队编制套入具体录音，已改为按示例列乐器并标明文献匹配性质。", "sources": [{"title": "教材第 12 章听辨指南（第三版扫描）", "url": "https://ahsibmusic.weebly.com/uploads/3/8/5/9/38592287/south_america_and_mexico.pdf"}, {"title": "Grinnell College：桑巴有多种风格与编制", "url": "https://omeka-s.grinnell.edu/s/MusicalInstruments/page/samba"}], "meta": {"title": "Brazil-Samba", "album": "World Music: A Global Journey", "artist": "Various Artists", "date": "2005", "track": "23/36", "disc": "2/2", "durationSeconds": 121.927982}, "inst": ["guitar", "cavaquinho", "electric-bass", "surdo", "cuica", "pandeiro", "maraca", "caixa", "tamborim", "agogo"], "ctx": {"guitar": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "cavaquinho": "曲目说明提及；实际出现情况请结合听辨与核对说明。", "electric-bass": "曲目说明提及；实际出 function playSample(btn){
  const src=btn.dataset.s;
  if(!sa.paused && sa.dataset.src===src){ sa.pause(); btn.classList.remove('on'); btn.textContent='▶ 试听'; return; }
  la.pause(); document.querySelectorAll('.iph .play.on').forEach(b=>{b.classList.remove('on');b.textContent='▶ 试听';});
  sa.src=src; sa.dataset.src=src; sa.play().catch(()=>{}); btn.classList.add('on'); btn.textContent='■ 停止';
}

const AK = new Uint8Array([188, 180, 204, 122, 238, 50, 205, 106, 70, 247, 46, 57, 146, 124, 212, 191, 214, 213, 5, 91, 50, 227, 47, 225, 215, 217, 136, 73, 232, 73, 146, 222, 243, 248, 162, 106, 200, 84, 234, 205, 212, 95, 229, 157, 116, 195, 148, 141, 223, 117, 112, 178, 63, 3, 246, 124, 68, 91, 167, 197, 121]);
const blobs = {}, pending = {};
function audioURL(t){
  if(blobs[t.id]) return Promise.resolve(blobs[t.id]);
  if(pending[t.id]) return pending[t.id];
  return pending[t.id] = fetch(t.src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(buf=>{
    const b=new Uint8Array(buf), k=AK.length; for(let i=0;i<b.length;i++) b[i]^=AK[i%k];
    return blobs[t.id]=URL.createObjectURL(new Blob([b],{type:'audio/mp4'}));
  }).finally(()=>{ delete pending[t.id]; });
}

function lsLoad(i, autoplay){
  LS.i=i; LS.guessed=null; const t=tr();
  LS.win = [0, LS.clip==='full'?t.meta.durationSeconds:Math.min(+LS.clip,t.meta.durationSeconds)];
  const go=()=>{ LS.win=lsWindow(); la.currentTime=LS.win[0]; lsSeekUI(); if(autoplay){ sa.pause(); la.play().catch(()=>{ LS.msg='点 ▶ 开始播放'; lsState(); }); } };
  if(la.dataset.id!==t.id){
    la.pause(); la.dataset.id=t.id; LS.msg='正在加载录音…'; lsState();
    audioURL(t).then(u=>{ if(la.dataset.id!==t.id) return; LS.msg=''; la.src=u; la.addEventListener('loadedmetadata',go,{once:true}); la.load(); lsState(); })
      .catch(()=>{ LS.msg='录音加载失败，请刷新页面重试'; lsState(); });
  } else if(la.readyState>=1) go(); else la.addEventListener('loadedmetadata',go,{once:true});

}

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function lsStart(){
  let ids=LIB.tracks.map((t,i)=>i).filter(i=>LS.sel.has(LIB.tracks[i].id));
  if(!ids.length){ LS.msg='先勾选至少一首'; lsState(); return; }
  if(LS.shuffle) shuffleArr(ids);
  LS.queue=ids; LS.qpos=0; if(LS.blind){LS.bOk=0;LS.bN=0;}
  lsLoad(ids[0],true);
}
function lsAdvance(){
  if(!LS.queue){ la.currentTime=LS.win[0]; lsSeekUI(); lsState(); return; }
  if(LS.blind && LS.guessed===null){ LS.msg='选一个答案，再继续下一段'; lsState(); return; }
  LS.qpos++;
  if(LS.qpos>=LS.queue.length){
    if(LS.repeat){ if(LS.shuffle) shuffleArr(LS.queue); LS.qpos=0; }
    else { LS.queue=null; LS.msg = LS.blind?`练习完成 · 盲听 ${LS.bOk} / ${LS.bN}`:'练习完成'; lsState(); return; }
  }
  setTimeout(()=>lsLoad(LS.queue[LS.qpos],true),600);
}

}
function quizRender(){
  const n = QZ.order.length, done = Object.values(QZ.answers), right = done.filter(a=>a.ok).length;
  const counts = Object.fromEntries(Object.keys(TOPICS).map(t=>[t,QB.filter(q=>q[0]===t).length]));
  let html = `<div class="qwrap">
    <div class="qbar"><div class="qstat"><span><b>${right}</b>答对</span><span><b>${done.length-right}</b>答错</span><span><b>${QB.length}</b>题库</span></div>
    <div class="qtools"><button class="btn" id="qShuf" type="button">打乱顺序</button><button class="btn" id="qWrong" type="button" ${done.some(a=>!a.ok)?'':'disabled'}>${QZ.wrongOnly?'练全部题':'只练错题'}</button><button class="btn" id="qReset" type="button">清空记录</button></div></div>
    <div class="qtopics">${[['all','全部',QB.length],...Object.entries(TOPICS).map(([k,v])=>[k,v,counts[k]])].map(([k,v,c])=>`<button type="button" data-t="${k}" class="${QZ.topic===k?'on':''}">${v}<span>${c}</span></button>`).join('')}</div>
    <div class="prog"><i style="width:${n?((QZ.i)/n*100):0}%"></i></div>`;
  if(!n){ html += `<div class="qend"><div class="big">✓</div><p>这个范围里没有错题了。</p></div>`; }
  else if(QZ.i>=n){
    const per = Object.entries(TOPICS).map(([k,v])=>{const ids=QZ.order.filter(i=>QB[i][0]===k);if(!ids.length)return '';const ok=ids.filter(i=>QZ.answers[i]&&QZ.answers[i].ok).length;return `<tr><td>${v}</td><td>${ok} / ${ids.length}</td></tr>`}).join('');
    const ok = QZ.order.filter(i=>QZ.answers[i]&&QZ.answers[i].ok).length;
    html += `<div class="qend"><div class="eyebrow">本轮完成</div><div class="big">${ok} / ${n}</div><table>${per}</table><div class="qnext"><button class="nav" id="qAgain" type="button">再做一遍</button>${QZ.order.some(i=>!QZ.answers[i].ok)?'<button class="nav primary" id="qRetry" type="button">只练错题</button>':''}</div></div>`;
  } else {
    const qi = QZ.order[QZ.i], q = QB[qi], ans = QZ.answers[qi], oo = QZ.optOrder[qi];
    const answeredNow = ans && ans.round===QZ.round;
    html += `<div class="qcard"><div class="qhead"><div class="qmeta">Question ${QZ.i+1} of ${n} · ${TOPICS[q[0]]}</div><span class="hintwrap"><button class="hintbtn" type="button" aria-label="提示" aria-describedby="hintTip" aria-expanded="false">?</button><span class="hinttip" role="tooltip" id="hintTip"><b>提示</b>${HINTS[qi]}</span></span></div><p class="qtext">${q[1]}</p>
      <div class="opts">${oo.map((oi,pos)=>{let cls='',mk='';if(answeredNow){if(oi===q[3]){cls='right';mk='正确答案';}else if(oi===ans.pick){cls='wrong';mk='你的选择';}else cls='dim';}
        return `<button class="opt ${cls}" type="button" data-o="${oi}" ${answeredNow?'disabled':''}><span class="lt">${'ABCD'[pos]}</span><span>${q[2][oi]}</span><span class="mk">${mk}</span></button>`}).join('')}</div>`;
    if(answeredNow){
      const letter = 'ABCD'[oo.indexOf(q[3])];
      const ref = q[5]; const pg = ALL[ref[0]].pages[ref[1]];
      const showFig = !ans.ok || QZ.showFig;
      html += `<div class="fb ${ans.ok?'ok':'no'}"><div class="fb-head"><b>${ans.ok?'答对了':'答错了'}</b><span class="ans">${ans.ok?'':`正确答案是 <b>${letter}</b>：`}<span class="lat">${q[2][q[3]]}</span></span></div>
        <div class="fb-body ${showFig?'':'solo'}">${showFig?`<figure class="fig">${pg.fig}</figure>`:''}<div class="fb-why"><p>${q[4]}</p><p style="font-size:13px;color:var(--ink-3)">相关知识点：${ALL[ref[0]].name} · ${pg.t}</p>${!showFig?'<button class="more" id="qFig" type="button">看图解 →</button>':''}<button class="more" id="qGo" type="button">打开这个知识点的完整页面 →</button></div></div></div>
        <div class="qnext"><button class="nav primary" id="qNext" type="button">${QZ.i===n-1?'看结果':'下一题'} →</button></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  QZ.el.innerHTML = html;
  QZ.el.querySelectorAll('.qtopics button').forEach(b=>b.onclick=()=>{QZ.topic=b.dataset.t;QZ.wrongOnly=false;newRound();});
  QZ.el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const qi=QZ.order[QZ.i];const pick=+b.dataset.o;QZ.answers[qi]={pick,ok:pick===QB[qi][3],round:QZ.round};QZ.showFig=false;quizRender();const fb=QZ.el.querySelector('.fb');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  const hb=QZ.el.querySelector('.hintbtn'); if(hb) hb.onclick=e=>{e.stopPropagation();const w=hb.parentElement;const o=w.classList.toggle('open');hb.setAttribute('aria-expanded',o);};
  on('qNext',()=>{QZ.i++;quizRender();QZ.el.scrollTop=0;});
  on('qFig',()=>{QZ.showFig=true;quizRender();});
  on('qGo',()=>{const r=QB[QZ.order[QZ.i]][5];open(r[0],r[1]);});
  on('qShuf',()=>{shuffle(QZ.order);QZ.i=0;QZ.round++;quizRender();});
  on('qWrong',()=>{QZ.wrongOnly=!QZ.wrongOnly;newRound();});
  on('qReset',()=>{QZ.answers={};QZ.wrongOnly=false;newRound();});
  on('qAgain',()=>{QZ.wrongOnly=false;newRound();});
  on('qRetry',()=>{QZ.wrongOnly=true;newRound();});
}
QZ.round=0;
function newRound(){QZ.round++;buildOrder();quizRender();QZ.el.scrollTop=0;}
addEventListener('keydown',e=>{ if(!V.el.hidden||QZ.el.hidden) return; const k=e.key.toUpperCase(); const idx='ABCD'.indexOf(k); if(idx>=0||['1','2','3','4'].includes(k)){const b=QZ.el.querySelectorAll('.opt:not(:disabled)')[idx>=0?idx:+k-1]; if(b) b.click();} else if(e.key==='Enter'){const n=document.getElementById('qNext'); if(n&&document.activeElement.tagName!=='BUTTON') n.click();} });

const appEl=document.getElementById('app'), tabMap=document.getElementById('tabMap'), tabQuiz=document.getElementById('tabQuiz'), tabListen=document.getElementById('tabListen');
function setView(v){
  const q = v==='quiz', l = v==='listen';
  appEl.classList.toggle('quizmode',q||l); QZ.el.hidden=!q; $('listen').hidden=!l;
  tabMap.setAttribute('aria-selected',v==='map'); tabQuiz.setAttribute('aria-selected',q); tabListen.setAttribute('aria-selected',l);
  if(q && !QZ.order.length) newRound();
  if(l) lsBoot(); else { la.pause(); sa.pause(); }
  if(v==='map') requestAnimationFrame(layout);
}
tabMap.onclick=()=>setView('map'); tabQuiz.onclick=()=>setView('quiz'); tabListen.onclick=()=>setView('listen');
const h = location.hash.slice(1);
if(h==='quiz'||h==='listen') setView(h); else if(h && ALL[h]) open(h);
</script>
